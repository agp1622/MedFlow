services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: "MedFlow_Dev_2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "MedFlow_Dev_2024!" -Q "SELECT 1" -No || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=MedFlowDb;User Id=SA;Password=MedFlow_Dev_2024!;TrustServerCertificate=True;"
      Jwt__Key: "LOCAL_DEV_SECRET_KEY_REPLACE_IN_PROD_32CHARS"
      Jwt__Issuer: "MedFlowApi"
      Jwt__Audience: "MedFlowClient"
      Jwt__ExpiryMinutes: "60"
      ASPNETCORE_ENVIRONMENT: "Development"
      AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./medflow-client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: "http://localhost:8080"

volumes:
  sqldata:
