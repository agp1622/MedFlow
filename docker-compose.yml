services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$$SA_PASSWORD" -Q "SELECT 1" -No || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=MedFlowDb;User Id=SA;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env (32+ chars)}"
      Jwt__Issuer: "MedFlowApi"
      Jwt__Audience: "MedFlowClient"
      Jwt__ExpiryMinutes: "60"
      ASPNETCORE_ENVIRONMENT: "Development"
      SeedUser__Email: "${SEED_USER_EMAIL:-}"
      SeedUser__Password: "${SEED_USER_PASSWORD:-}"
      SeedUser__PatientEmail: "${SEED_PATIENT_EMAIL:-}"
      SeedUser__PatientPassword: "${SEED_PATIENT_PASSWORD:-}"
      Email__SenderEmail: "${EMAIL_SENDER:-}"
      Email__AppPassword: "${EMAIL_APP_PASSWORD:-}"
      AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./medflow-client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: "http://localhost:8080"

volumes:
  sqldata:
